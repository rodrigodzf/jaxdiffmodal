[project]
name="jaxdiffmodal"
version = "0.1.0"
description = "A collection of vibration models (e.g. von Kármán plates, tension-modulated and stiff strings) implemented in JAX for fast, differentiable simulations"
readme = "README.md"
requires-python=">=3.11"
dependencies = [
    "jax>=0.7.0; sys_platform != 'linux'",
    "jax[cuda12]>=0.7.0; sys_platform == 'linux'",
    "einops>=0.8.0",
    "nemus-magpie",
    "numpy>=2.2.0",
    "scipy>=1.15.1",
    "tabulate>=0.9.0",
    "equinox>=0.11.12",
    "jaxtyping>=0.3.2",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
cuda = [
    "cuquantum-python-cu12>=24.11.0; sys_platform == 'linux'",
    "cupy-cuda12x>=13.3.0; sys_platform == 'linux'",
]
dev = [
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.0",
    "scienceplots>=2.1.1",
    "ffmpeg-python>=0.2.0",
    "nbformat>=5.10.4",
    "nbclient>=0.10.2",
    "ipykernel>=6.29.5",
    "ruff>=0.9.2",
    "pytest>=8.4.1",
    "quartodoc>=0.11.1",
]
benchmark = [
    "pandas>=2.2.3",
    "jaxopt>=0.8.3",
    "spectrum>=0.9.0",
    "lineax>=0.0.7",
    "soxr>=0.5.0.post1",
    "seaborn>=0.13.2",
    "scienceplots>=2.1.1",
    "llvmlite>=0.44.0",
    "numba>=0.57",
    "librosa>=0.11.0",
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "jaxdiffmodal/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"
output-format = "concise"

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722", "UP038"]
ignore-init-module-imports = true
select = ["E", "F", "I001", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false

[tool.uv.sources]
nemus-magpie = { git = "https://github.com/Nemus-Project/magpie-python", rev = "9779bbd9f461de55c196ca7080c12ea6a6056407" }
# torch = { url = "https://download.pytorch.org/whl/nightly/cu128/torch-2.8.0.dev20250319%2Bcu128-cp39-cp39-manylinux_2_28_x86_64.whl" }